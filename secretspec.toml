[profiles.default]
HCLOUD_TOKEN = {description = "Hetzner API token", providers = ["default"], required = true}
CLOUDFLARE_API_TOKEN = {description = "Cloudflare API token", providers = ["default"], required = true}
NB_PAT = {description = "Netbird management access token", providers = ["default"], required = true}
POCKETID_API_TOKEN = {description = "Pocket ID API token", providers = ["default"], required = true}
AWS_ACCESS_KEY_ID = {description = "Terraform backend access key", providers = ["default"], required = true}
AWS_SECRET_ACCESS_KEY = {description = "Terraform backend secret key", providers = ["default"], required = true}
AWS_SSE_CUSTOMER_KEY = {description = "Terraform backend encryption key", providers = ["default"], required = true}

[project]
name = "nix-config"
revision = "1.0"

[providers]
default = "sops://secrets/secrets.sops.yaml"
